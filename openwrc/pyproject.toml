[project]
name = "openwrc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "plotly>=6.5.2",
    "questionary>=2.0.1",
    "rich>=13.0.0",
    "pydantic-extra-types>=2.11.0",
    "sqlalchemy>=2.0.46",
    "streamlit>=1.30.0",
    "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwrc"]

[tool.ruff]
exclude = [
    "tests",
    ".git",
    "__pycache__",
    ".venv",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.2",
]
